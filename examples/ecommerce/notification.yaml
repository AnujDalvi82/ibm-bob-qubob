apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: ecommerce
  labels:
    app: notification
    tier: platform
    app.kubernetes.io/part-of: qubob-demo
  annotations:
    qubob.io/rpc-deps: "redis:300"
    qubob.io/description: "Async email/SMS dispatcher — reads events from Redis queue"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
        tier: platform
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 60
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis
                topologyKey: kubernetes.io/hostname
      containers:
        - name: notification
          image: ecommerce/notification:1.0.7
          ports:
            - containerPort: 8085
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: SMTP_HOST
              value: "smtp.sendgrid.net"
            - name: SMTP_PORT
              value: "587"
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: ecommerce
spec:
  selector:
    app: notification
  ports:
    - port: 8085
      targetPort: 8085
