apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ecommerce
  labels:
    app: payment
    tier: business
    app.kubernetes.io/part-of: qubob-demo
  annotations:
    qubob.io/rpc-deps: "order:200,notification:80,postgres:500"
    qubob.io/description: "PCI-DSS payment processor — must co-locate with Postgres"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        tier: business
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres
                topologyKey: kubernetes.io/hostname
      containers:
        - name: payment
          image: ecommerce/payment:1.9.1
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: "300m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: ORDER_SERVICE_URL
              value: "http://order:8082"
            - name: NOTIFICATION_URL
              value: "http://notification:8085"
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: ecommerce
spec:
  selector:
    app: payment
  ports:
    - port: 8084
      targetPort: 8084
