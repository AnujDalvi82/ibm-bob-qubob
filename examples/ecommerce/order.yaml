apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce
  labels:
    app: order
    tier: business
    app.kubernetes.io/part-of: qubob-demo
  annotations:
    qubob.io/rpc-deps: "postgres:800,inventory:350,notification:120,payment:60"
    qubob.io/description: "Order orchestration service — heavy Postgres R/W"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
        tier: business
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres
                topologyKey: kubernetes.io/hostname
      containers:
        - name: order
          image: ecommerce/order:3.0.4
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "400m"
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8083"
            - name: NOTIFICATION_URL
              value: "http://notification:8085"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment:8084"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce
spec:
  selector:
    app: order
  ports:
    - port: 8082
      targetPort: 8082
