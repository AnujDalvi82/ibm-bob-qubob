apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ecommerce
  labels:
    app: cart
    tier: business
    app.kubernetes.io/part-of: qubob-demo
  annotations:
    qubob.io/rpc-deps: "redis:2500,order:120,inventory:90"
    qubob.io/description: "Shopping cart service — high-frequency Redis R/W"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
        tier: business
    spec:
      containers:
        - name: cart
          image: ecommerce/cart:2.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ORDER_SERVICE_URL
              value: "http://order:8082"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8083"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: ecommerce
spec:
  selector:
    app: cart
  ports:
    - port: 8080
      targetPort: 8080
