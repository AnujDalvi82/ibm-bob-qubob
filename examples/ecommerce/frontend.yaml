apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    tier: presentation
    app.kubernetes.io/part-of: qubob-demo
  annotations:
    qubob.io/rpc-deps: "cart:150,auth:300,analytics:50"
    qubob.io/description: "React SPA + Next.js SSR gateway"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
        - name: frontend
          image: ecommerce/frontend:1.4.2
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: CART_SERVICE_URL
              value: "http://cart:8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth:8081"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics:9090"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
