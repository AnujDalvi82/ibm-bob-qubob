apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-session
  namespace: fintech
  labels:
    app: redis-session
    tier: infrastructure
    app.kubernetes.io/part-of: qubob-fintech-demo
  annotations:
    qubob.io/rpc-deps: ""
    qubob.io/description: "Redis 7 session store — user sessions, JWT refresh tokens, OAuth state"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis-session
  template:
    metadata:
      labels:
        app: redis-session
        tier: infrastructure
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: redis-session
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: identity-auth
                topologyKey: kubernetes.io/hostname
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: web-bff
                topologyKey: kubernetes.io/hostname
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis-session
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis-session
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "500m"
              memory: "2048Mi"
            limits:
              cpu: "1000m"
              memory: "4096Mi"
          args:
            - "--maxmemory"
            - "3800mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--appendonly"
            - "yes"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis-session
  namespace: fintech
spec:
  selector:
    app: redis-session
  ports:
    - port: 6379
      targetPort: 6379
