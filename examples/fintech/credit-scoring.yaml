apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring
  namespace: fintech
  labels:
    app: credit-scoring
    tier: risk
    app.kubernetes.io/part-of: qubob-fintech-demo
    pci-scope: in-scope
  annotations:
    qubob.io/rpc-deps: "clickhouse-analytics:1800,postgres-primary:1100,audit-logger:600"
    qubob.io/description: "FICO-style credit scoring engine — bureau pull, scorecard computation, limit decisioning"
    qubob.io/pci-dss: "data-classification-sensitive"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-scoring
  template:
    metadata:
      labels:
        app: credit-scoring
        tier: risk
        pci-scope: in-scope
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: credit-scoring
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: clickhouse-analytics
                topologyKey: kubernetes.io/hostname
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres-primary
                topologyKey: kubernetes.io/hostname
      containers:
        - name: credit-scoring
          image: fintech/credit-scoring:3.2.0
          ports:
            - containerPort: 8093
          resources:
            requests:
              cpu: "1000m"
              memory: "2048Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          env:
            - name: CLICKHOUSE_URL
              value: "http://clickhouse-analytics:8123"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: BUREAU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: credit-secret
                  key: bureau-key
            - name: AUDIT_SERVICE_URL
              value: "http://audit-logger:8099"
          livenessProbe:
            httpGet:
              path: /health
              port: 8093
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: credit-scoring
  namespace: fintech
spec:
  selector:
    app: credit-scoring
  ports:
    - port: 8093
      targetPort: 8093
