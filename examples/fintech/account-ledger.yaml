apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-ledger
  namespace: fintech
  labels:
    app: account-ledger
    tier: core-banking
    app.kubernetes.io/part-of: qubob-fintech-demo
    pci-scope: in-scope
  annotations:
    qubob.io/rpc-deps: "postgres-primary:2800,postgres-replica:1400,kafka-cluster:1800,audit-logger:1200"
    qubob.io/description: "Double-entry account ledger — balance queries, transaction journaling, reconciliation"
    qubob.io/pci-dss: "cardholder-data-environment"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: account-ledger
  template:
    metadata:
      labels:
        app: account-ledger
        tier: core-banking
        pci-scope: in-scope
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: account-ledger
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 95
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres-primary
                topologyKey: kubernetes.io/hostname
            - weight: 85
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka-cluster
                topologyKey: kubernetes.io/hostname
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: account-ledger
                topologyKey: kubernetes.io/hostname
      containers:
        - name: account-ledger
          image: fintech/account-ledger:5.3.2
          ports:
            - containerPort: 8092
          resources:
            requests:
              cpu: "1500m"
              memory: "2048Mi"
            limits:
              cpu: "3000m"
              memory: "4096Mi"
          env:
            - name: PRIMARY_DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: primary-url
            - name: REPLICA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: replica-url
            - name: KAFKA_BROKERS
              value: "kafka-cluster:9092"
            - name: AUDIT_SERVICE_URL
              value: "http://audit-logger:8099"
          livenessProbe:
            httpGet:
              path: /health
              port: 8092
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8092
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: account-ledger
  namespace: fintech
spec:
  selector:
    app: account-ledger
  ports:
    - port: 8092
      targetPort: 8092
