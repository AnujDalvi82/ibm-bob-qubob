apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary
  namespace: fintech
  labels:
    app: postgres-primary
    tier: data
    app.kubernetes.io/part-of: qubob-fintech-demo
    pci-scope: in-scope
  annotations:
    qubob.io/rpc-deps: ""
    qubob.io/description: "PostgreSQL 16 primary — ACID transactional store for accounts, cards, KYC records"
    qubob.io/pci-dss: "cardholder-data-environment"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
        tier: data
        pci-scope: in-scope
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: postgres-primary
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgres-replica
              topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: account-ledger
                topologyKey: kubernetes.io/hostname
      containers:
        - name: postgres-primary
          image: postgres:16.3-alpine
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "2000m"
              memory: "4096Mi"
            limits:
              cpu: "4000m"
              memory: "8192Mi"
          env:
            - name: POSTGRES_DB
              value: "fintech"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: fintech
spec:
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
