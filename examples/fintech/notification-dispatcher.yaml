apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-dispatcher
  namespace: fintech
  labels:
    app: notification-dispatcher
    tier: messaging
    app.kubernetes.io/part-of: qubob-fintech-demo
  annotations:
    qubob.io/rpc-deps: "kafka-cluster:3200,redis-session:800"
    qubob.io/description: "Async notification dispatcher — push, SMS (Twilio), email (SES), in-app alerts"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-dispatcher
  template:
    metadata:
      labels:
        app: notification-dispatcher
        tier: messaging
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka-cluster
                topologyKey: kubernetes.io/hostname
            - weight: 60
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis-session
                topologyKey: kubernetes.io/hostname
      containers:
        - name: notification-dispatcher
          image: fintech/notification-dispatcher:3.1.0
          ports:
            - containerPort: 8098
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          env:
            - name: KAFKA_BROKERS
              value: "kafka-cluster:9092"
            - name: REDIS_URL
              value: "redis://redis-session:6379"
            - name: TWILIO_SID
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: twilio-sid
            - name: SES_REGION
              value: "us-east-1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8098
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-dispatcher
  namespace: fintech
spec:
  selector:
    app: notification-dispatcher
  ports:
    - port: 8098
      targetPort: 8098
